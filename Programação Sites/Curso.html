<!DOCTYPE html>
<html lang="pt-br">
    <title>Lojinha de Futebol</title>
    <meta charset="UTF-8">
    <head>
        <style>

      .titulo{
        text-align: center;
        color: green;
        font-size: 35px;
        transition: 0.5s;
      }
      .titulo:hover{
        color: rgb(99, 185, 13);
        transform: translateY(-10px);
        transition: 0.5s;

      }
      .texto{
        text-align: center;
        color: rgb(0, 0, 252);
        font-size:20px;
      }
      /*Para selcionar o ID é preciso usar a # */
     #objetivo{
        text-align: center;
        color: rgb(255, 0, 0);
        font-size:70px;
      }
      .card{
        text-align: center;
        border-radius: 23px;
        background-color: rgb(10, 92, 3);
        color: rgb(68, 255, 0);
        font-size:50px;
        transition: 0.5s;
      }
      .card:hover{
        
        color: rgba(62, 255, 110, 0.875);
        transform: translateY(-5px);
        transition: 0.5s;
      }
      .imagem{
        text-align: center;
      }
        </style>
    </head>
    <body>
<div class="imagem">
    <img src="esporte.jpeg" >
</div>
        
 <div class="titulo">
        <h1 >Vendinha de Futebol</h1>
 </div>


<div class = "texto">
        <p id="objetivo">Nosso objetivo é fazer nossos clientes felizes </p> 
        <p>Boa experiência </p> 
</div class>


<div class="card">
    <card>Nós somos responsáveis por <strong>vender</strong> coisinhas de Futebol </card>
</div>



      </body>
   
</html>
